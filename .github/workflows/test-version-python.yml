name: Python version matrix
on:
  workflow_dispatch:
jobs:
  test-python:
    strategy:
      matrix:
        python-version: ["3.10","3.11","3.12"]
    runs-on: ubuntu-22.04
    steps:
      - name: install python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
